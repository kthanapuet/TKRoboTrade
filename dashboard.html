<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TKRoboTrade | Portfolio Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --surface: rgba(25, 30, 45, 0.7);
            --surface-hover: rgba(35, 42, 60, 0.8);
            --border: rgba(255, 255, 255, 0.1);
            --primary: #00e676;
            --primary-glow: rgba(0, 230, 118, 0.3);
            --danger: #ff1744;
            --danger-glow: rgba(255, 23, 68, 0.3);
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(0, 230, 118, 0.05), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(0, 191, 255, 0.05), transparent 25%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--surface);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 3rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(to right, #fff, #a5b4fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .input-group {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            position: relative;
        }

        input {
            flex: 1;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 1rem 1.5rem;
            border-radius: 12px;
            font-size: 1.1rem;
            outline: none;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 15px var(--primary-glow);
        }

        button {
            background: var(--primary);
            color: #000;
            border: none;
            padding: 0 2rem;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px var(--primary-glow);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px var(--primary-glow);
            filter: brightness(1.1);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background: var(--border);
            color: var(--text-muted);
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        .loader {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(0,0,0,0.3);
            border-top-color: #000;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 10px;
            vertical-align: middle;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        .error-message {
            color: var(--danger);
            margin-top: -1rem;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            display: none;
        }

        .portfolio-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .portfolio-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.15);
            border: 1px solid var(--border);
            padding: 1.2rem 1.5rem;
            border-radius: 16px;
            transition: all 0.3s ease;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }

        .portfolio-item:hover {
            background: var(--surface-hover);
            transform: translateX(5px);
            border-color: rgba(255,255,255,0.2);
        }

        .symbol-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .symbol-name {
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--text);
            letter-spacing: 0.5px;
        }

        .symbol-status {
            font-size: 0.8rem;
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .status-active {
            background: rgba(0, 230, 118, 0.15);
            color: var(--primary);
            border: 1px solid rgba(0, 230, 118, 0.3);
        }

        .status-disabled {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
            border: 1px solid var(--border);
        }

        .actions {
            display: flex;
            gap: 0.8rem;
        }

        .btn-toggle {
            background: transparent;
            color: var(--text);
            border: 1px solid var(--border);
            padding: 0.6rem 1.2rem;
            font-size: 0.9rem;
            box-shadow: none;
        }

        .btn-toggle:hover {
            background: rgba(255,255,255,0.1);
            border-color: rgba(255,255,255,0.3);
            box-shadow: none;
            color: #fff;
        }

        .btn-delete {
            background: rgba(255, 23, 68, 0.1);
            color: var(--danger);
            border: 1px solid rgba(255, 23, 68, 0.3);
            padding: 0.6rem 1.2rem;
            font-size: 0.9rem;
            box-shadow: none;
        }

        .btn-delete:hover {
            background: var(--danger);
            color: #fff;
            box-shadow: 0 4px 15px var(--danger-glow);
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
            font-style: italic;
        }

        #scrollTopBtn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            color: var(--text);
            border: 1px solid var(--border);
            font-size: 1.5rem;
            cursor: pointer;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            z-index: 1000;
            padding: 0;
        }

        #scrollTopBtn:hover {
            background: var(--primary);
            color: #000;
            border-color: var(--primary);
            box-shadow: 0 0 20px var(--primary-glow);
            transform: translateY(-5px);
        }

        #scrollTopBtn.show {
            opacity: 1;
            visibility: visible;
        }

        .loading-state {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 3rem;
            flex-direction: column;
            gap: 1rem;
            animation: fadeIn 0.4s ease;
        }

        .main-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        /* --- Mobile Responsiveness --- */
        @media (max-width: 600px) {
            body {
                padding: 1rem;
            }
            .container {
                padding: 1.5rem;
                border-radius: 16px;
            }
            h1 {
                font-size: 2rem;
            }
            .subtitle {
                font-size: 0.95rem;
            }
            .input-group {
                flex-direction: column;
            }
            input {
                padding: 1rem;
                font-size: 1rem;
            }
            button#addBtn {
                width: 100%;
                padding: 1rem;
                justify-content: center;
                display: flex;
                align-items: center;
            }
            .portfolio-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 1.2rem;
                padding: 1.25rem 1rem;
            }
            .symbol-info {
                width: 100%;
                justify-content: space-between;
            }
            .actions {
                width: 100%;
                display: flex;
                gap: 0.5rem;
            }
            .btn-toggle, .btn-delete {
                flex: 1;
                padding: 0.8rem 0.5rem;
                font-size: 0.95rem;
                font-weight: 600;
            }
            #scrollTopBtn {
                bottom: 20px;
                right: 20px;
                width: 45px;
                height: 45px;
            }
        }

    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>TKRoboTrade Portfolio</h1>
            <p class="subtitle">Manage and validate your active trading symbols</p>
        </header>

        <div class="input-group">
            <input type="text" id="symbolInput" placeholder="Enter Symbol (e.g. AAPL, PTT.BK)" onkeypress="handleEnter(event)">
            <button id="addBtn" onclick="addSymbol()">
                Add Symbol <div class="loader" id="addLoader"></div>
            </button>
        </div>
        <div class="error-message" id="errorMsg"></div>

        <ul class="portfolio-list" id="portfolioList">
            <!-- Items injected by JS -->
        </ul>
    </div>

    <button id="scrollTopBtn" title="Go to top">↑</button>

    <script>
        document.addEventListener('DOMContentLoaded', fetchPortfolio);

        const API_URL = '/api/portfolio';

        async function fetchPortfolio() {
            const list = document.getElementById('portfolioList');
            // Show loading skeleton / spinner
            list.innerHTML = `
                <div class="loading-state">
                    <div class="main-spinner"></div>
                    <div style="color: var(--text-muted); font-size: 1.1rem;">Loading your assets...</div>
                </div>
            `;
            
            try {
                const res = await fetch(API_URL);
                const data = await res.json();
                renderPortfolio(data);
            } catch (err) {
                showError("Failed to load portfolio: " + err.message);
                list.innerHTML = `<div class="empty-state" style="color:var(--danger)">Error loading data. Check server connection.</div>`;
            }
        }

        function renderPortfolio(items) {
            const list = document.getElementById('portfolioList');
            list.innerHTML = '';

            if(items.length === 0) {
                list.innerHTML = `<div class="empty-state">No symbols in portfolio. Start by adding one above.</div>`;
                return;
            }

            items.forEach(item => {
                const isEnabled = item.enabled !== false; // Default to true
                
                const li = document.createElement('li');
                li.className = 'portfolio-item';
                
                li.innerHTML = `
                    <div class="symbol-info">
                        <span class="symbol-name" style="opacity: ${isEnabled ? '1' : '0.5'}">${item.symbol}</span>
                        <span class="symbol-status ${isEnabled ? 'status-active' : 'status-disabled'}">
                            ${isEnabled ? 'Active' : 'Disabled'}
                        </span>
                    </div>
                    <div class="actions">
                        <button class="btn-toggle" onclick="toggleSymbol('${item.symbol}')">
                            ${isEnabled ? 'Disable' : 'Enable'}
                        </button>
                        <button class="btn-delete" onclick="deleteSymbol('${item.symbol}')">Delete</button>
                    </div>
                `;
                list.appendChild(li);
            });
        }

        function handleEnter(e) {
            if(e.key === 'Enter') addSymbol();
        }

        async function addSymbol() {
            const input = document.getElementById('symbolInput');
            const symbol = input.value.trim().toUpperCase();
            if(!symbol) return;

            setLoading(true);
            showError("");

            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ symbol })
                });

                const data = await res.json();
                
                if(!res.ok) {
                    throw new Error(data.error || "Failed to add symbol");
                }

                input.value = '';
                await fetchPortfolio();
                
            } catch (err) {
                showError(err.message);
            } finally {
                setLoading(false);
            }
        }

        async function deleteSymbol(symbol) {
            if(!confirm(`Are you sure you want to delete ${symbol}?`)) return;
            
            try {
                await fetch(`${API_URL}?symbol=${encodeURIComponent(symbol)}`, { method: 'DELETE' });
                await fetchPortfolio();
            } catch (err) {
                showError("Failed to delete: " + err.message);
            }
        }

        async function toggleSymbol(symbol) {
            try {
                await fetch(`${API_URL}/toggle?symbol=${encodeURIComponent(symbol)}`, { method: 'PUT' });
                await fetchPortfolio();
            } catch (err) {
                showError("Failed to toggle: " + err.message);
            }
        }

        function setLoading(isLoading) {
            document.getElementById('addBtn').disabled = isLoading;
            document.getElementById('addLoader').style.display = isLoading ? 'inline-block' : 'none';
        }

        function showError(msg) {
            const errDiv = document.getElementById('errorMsg');
            errDiv.style.display = msg ? 'block' : 'none';
            errDiv.innerText = msg;
        }

        // Scroll to Top Logic
        const scrollTopBtn = document.getElementById('scrollTopBtn');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 150) {
                scrollTopBtn.classList.add('show');
            } else {
                scrollTopBtn.classList.remove('show');
            }
        });
        
        scrollTopBtn.addEventListener('click', () => {
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
        });
    </script>
</body>
</html>
